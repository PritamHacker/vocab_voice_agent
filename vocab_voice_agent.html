<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Voice Agent – Learn Vocabulary</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #4ade80;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }
    .card {
      background: var(--card);
      border-radius: 1rem;
      padding: 1.75rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    .word-display {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .word {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.4rem;
    }
    .pronunciation {
      color: var(--accent);
      font-style: italic;
      font-size: 1.1rem;
      margin-bottom: 0.8rem;
    }
    .definition {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
      min-height: 3.5rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.5rem;
    }
    button {
      background: #334155;
      color: var(--text);
      border: none;
      border-radius: 0.6rem;
      padding: 0.7rem 1.2rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    button:hover { background: #475569; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
    }
    button.primary:hover { filter: brightness(1.1); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2rem;
    }
    .mode-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      justify-content: center;
    }
    .mode-toggle button {
      flex: 1;
      max-width: 140px;
      background: #1e293b;
      border: 1px solid #475569;
    }
    .mode-toggle button.active {
      background: #334155;
      border-color: var(--accent);
      color: var(--accent);
    }
    .quiz-area {
      display: none;
      margin-top: 1rem;
      text-align: center;
    }
    .quiz-area.visible { display: block; }
    .quiz-prompt {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--muted);
    }
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .feedback {
      font-weight: 600;
      margin-top: 0.5rem;
      min-height: 1.4rem;
    }
    .feedback.correct { color: var(--success); }
    .feedback.wrong { color: var(--danger); }
    .mic-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      position: relative;
    }
    .mic-btn.listening {
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <h1>Vocab Voice Agent</h1>
  <p class="subtitle">Learn new words with voice</p>

  <div class="card">
    <div class="mode-toggle">
      <button id="btnLearn" class="active" onclick="setMode('learn')">Learn Mode</button>
      <button id="btnQuiz" onclick="setMode('quiz')">Quiz Mode</button>
    </div>

    <div class="word-display">
      <div class="word" id="word">—</div>
      <div class="pronunciation" id="pronunciation"></div>
      <div class="definition" id="definition">Click “New Word” to start</div>
    </div>

    <div class="controls">
      <button class="primary" id="btnNew" onclick="fetchWord()">
        🔄 New Word
      </button>
      <button id="btnSpeakWord" onclick="speakWord()" disabled>
        🔊 Say Word
      </button>
      <button id="btnSpeakDef" onclick="speakDefinition()" disabled>
        📢 Say Definition
      </button>
      <button id="btnSpeakAll" onclick="speakAll()" disabled>
        🎧 Full Lesson
      </button>
      <button class="mic-btn" id="btnMic" onclick="startListening()" disabled title="Speak the word and get checked">
        🎤 Speak & Check
      </button>
    </div>

    <div class="quiz-area" id="quizArea">
      <div class="quiz-prompt" id="quizPrompt">Listen carefully, then type the word.</div>
      <input type="text" id="quizInput" placeholder="Type the word here..." autocomplete="off">
      <div class="controls">
        <button class="primary" onclick="checkAnswer()">Check</button>
        <button onclick="speakDefinition()">Replay Definition</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <footer>
    Built with ❤️ by Pritam Kumar
    <!-- Words from multiple open-source APIs + 50 offline fallback words<br>
    <a href="https://github.com/mcnaveen/Random-Words-API" target="_blank">Random Words API</a> ·
    <a href="https://github.com/RazorSh4rk/random-word-api" target="_blank">Random Word API</a> ·
    <a href="https://dictionaryapi.dev/" target="_blank">Free Dictionary API</a><br>
    Voice & speech recognition powered by browser Web Speech API<br>
    <small>
      Tips: use Chrome/Edge · speak clearly · one word only · quiet room · allow mic permission
    </small> -->
  </footer>

  <script>
    // State
    let current = { word: '', definition: '', pronunciation: '' };
    let mode = 'learn';
    let speaking = false;
    let recognition = null;
    let isListening = false;

    // Speech Recognition setup (Chrome / Edge / Safari support)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;          // show live partial results
      recognition.maxAlternatives = 5;           // more guesses
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('btnMic').classList.add('listening');
        document.getElementById('btnMic').textContent = '🔴 Listening…';
        setStatus('Speak clearly into the mic…');
      };

      recognition.onresult = (event) => {
        // Collect ALL alternatives from final + interim
        let best = '';
        const alternatives = [];
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const res = event.results[i];
          for (let j = 0; j < res.length; j++) {
            const transcript = res[j].transcript.trim().toLowerCase();
            if (transcript) alternatives.push(transcript);
            if (j === 0) best = transcript;
          }
          // Only judge on final result
          if (res.isFinal) {
            checkSpokenWord(best, alternatives);
          }
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        document.getElementById('btnMic').classList.remove('listening');
        document.getElementById('btnMic').textContent = '🎤 Speak & Check';
        if (event.error === 'no-speech') {
          setStatus('No speech detected. Speak louder / closer to mic.');
        } else if (event.error === 'not-allowed') {
          setStatus('Microphone permission denied. Allow mic access and retry.');
        } else if (event.error === 'aborted') {
          // ignore – user stopped it
        } else {
          setStatus('Recognition error: ' + event.error + '. Try again.');
        }
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('btnMic').classList.remove('listening');
        document.getElementById('btnMic').textContent = '🎤 Speak & Check';
      };
    }

    // Prefer a clear English voice
    function getVoice() {
      const voices = speechSynthesis.getVoices();
      // Prefer high-quality English voices
      const preferred = voices.find(v =>
        v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Microsoft'))
      ) || voices.find(v => v.lang.startsWith('en')) || voices[0];
      return preferred;
    }

    function speak(text, rate = 0.9) {
      return new Promise((resolve) => {
        if (!window.speechSynthesis) {
          setStatus('Speech synthesis not supported in this browser');
          resolve();
          return;
        }
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.voice = getVoice();
        u.rate = rate;
        u.pitch = 1;
        u.onend = () => { speaking = false; resolve(); };
        u.onerror = () => { speaking = false; resolve(); };
        speaking = true;
        speechSynthesis.speak(u);
      });
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btnLearn').classList.toggle('active', m === 'learn');
      document.getElementById('btnQuiz').classList.toggle('active', m === 'quiz');
      document.getElementById('quizArea').classList.toggle('visible', m === 'quiz');
      document.getElementById('definition').style.display = m === 'quiz' ? 'none' : 'block';
      document.getElementById('feedback').textContent = '';
      document.getElementById('quizInput').value = '';
      if (m === 'quiz' && current.word) {
        // Hide the word visually in quiz mode
        document.getElementById('word').textContent = '???';
        document.getElementById('pronunciation').textContent = '';
      } else if (current.word) {
        showCurrent();
      }
    }

    function showCurrent() {
      document.getElementById('word').textContent = current.word;
      document.getElementById('pronunciation').textContent = current.pronunciation ? `/${current.pronunciation}/` : '';
      document.getElementById('definition').textContent = current.definition || 'No definition available';
    }

    // 50 high-quality offline vocabulary words (always available)
    const OFFLINE_WORDS = [
      { word: 'Ephemeral', definition: 'Lasting for a very short time', pronunciation: 'ih-FEM-er-uhl' },
      { word: 'Serendipity', definition: 'The occurrence of events by chance in a happy or beneficial way', pronunciation: 'ser-uhn-DIP-ih-tee' },
      { word: 'Eloquent', definition: 'Fluent or persuasive in speaking or writing', pronunciation: 'EL-uh-kwuhnt' },
      { word: 'Resilient', definition: 'Able to withstand or recover quickly from difficulties', pronunciation: 'rih-ZIL-yuhnt' },
      { word: 'Ambiguous', definition: 'Open to more than one interpretation; not having one obvious meaning', pronunciation: 'am-BIG-yoo-uhs' },
      { word: 'Pragmatic', definition: 'Dealing with things sensibly and realistically', pronunciation: 'prag-MAT-ik' },
      { word: 'Benevolent', definition: 'Well-meaning and kindly', pronunciation: 'buh-NEV-uh-luhnt' },
      { word: 'Candid', definition: 'Truthful and straightforward; frank', pronunciation: 'KAN-did' },
      { word: 'Diligent', definition: 'Having or showing care and conscientiousness in work', pronunciation: 'DIL-ih-juhnt' },
      { word: 'Empathy', definition: 'The ability to understand and share the feelings of another', pronunciation: 'EM-puh-thee' },
      { word: 'Fortitude', definition: 'Courage in pain or adversity', pronunciation: 'FOR-tih-tood' },
      { word: 'Gregarious', definition: 'Fond of company; sociable', pronunciation: 'grih-GAIR-ee-uhs' },
      { word: 'Hypothesis', definition: 'A proposed explanation made on the basis of limited evidence', pronunciation: 'hy-POTH-uh-sis' },
      { word: 'Impeccable', definition: 'In accordance with the highest standards; faultless', pronunciation: 'im-PEK-uh-buhl' },
      { word: 'Juxtapose', definition: 'To place close together for contrasting effect', pronunciation: 'JUK-stuh-pohz' },
      { word: 'Keen', definition: 'Having or showing eagerness or enthusiasm', pronunciation: 'keen' },
      { word: 'Lethargic', definition: 'Affected by lethargy; sluggish and apathetic', pronunciation: 'luh-THAR-jik' },
      { word: 'Meticulous', definition: 'Showing great attention to detail; very careful', pronunciation: 'muh-TIK-yuh-luhs' },
      { word: 'Nostalgia', definition: 'A sentimental longing for the past', pronunciation: 'nuh-STAL-juh' },
      { word: 'Obsolete', definition: 'No longer produced or used; out of date', pronunciation: 'OB-suh-leet' },
      { word: 'Paradox', definition: 'A seemingly absurd statement that when investigated may prove true', pronunciation: 'PAIR-uh-doks' },
      { word: 'Quintessential', definition: 'Representing the most perfect example of a quality', pronunciation: 'kwin-tuh-SEN-shuhl' },
      { word: 'Rhetorical', definition: 'Relating to the art of persuasion in speaking or writing', pronunciation: 'rih-TOR-ih-kuhl' },
      { word: 'Stoic', definition: 'Enduring pain and hardship without complaint', pronunciation: 'STOH-ik' },
      { word: 'Tenacious', definition: 'Tending to keep a firm hold; persistent', pronunciation: 'tuh-NAY-shuhs' },
      { word: 'Ubiquitous', definition: 'Present, appearing, or found everywhere', pronunciation: 'yoo-BIK-wih-tuhs' },
      { word: 'Venerable', definition: 'Accorded a great deal of respect, especially because of age', pronunciation: 'VEN-er-uh-buhl' },
      { word: 'Wistful', definition: 'Having or showing a feeling of vague or regretful longing', pronunciation: 'WIST-fuhl' },
      { word: 'Zealous', definition: 'Having or showing great energy or enthusiasm', pronunciation: 'ZEL-uhs' },
      { word: 'Altruistic', definition: 'Showing a selfless concern for the well-being of others', pronunciation: 'al-troo-IS-tik' },
      { word: 'Brevity', definition: 'Concise and exact use of words; shortness', pronunciation: 'BREV-ih-tee' },
      { word: 'Cacophony', definition: 'A harsh, discordant mixture of sounds', pronunciation: 'kuh-KOF-uh-nee' },
      { word: 'Debilitate', definition: 'To make someone weak and infirm', pronunciation: 'dih-BIL-ih-tayt' },
      { word: 'Enigma', definition: 'A person or thing that is mysterious or difficult to understand', pronunciation: 'ih-NIG-muh' },
      { word: 'Frugal', definition: 'Sparing or economical with regard to money or food', pronunciation: 'FROO-guhl' },
      { word: 'Garrulous', definition: 'Excessively talkative, especially on trivial matters', pronunciation: 'GAIR-uh-luhs' },
      { word: 'Harbinger', definition: 'A person or thing that announces or signals the approach of another', pronunciation: 'HAR-bin-jer' },
      { word: 'Ineffable', definition: 'Too great or extreme to be expressed in words', pronunciation: 'in-EF-uh-buhl' },
      { word: 'Jovial', definition: 'Cheerful and friendly', pronunciation: 'JOH-vee-uhl' },
      { word: 'Kudos', definition: 'Praise and honor received for an achievement', pronunciation: 'KOO-dohs' },
      { word: 'Lucid', definition: 'Expressed clearly; easy to understand', pronunciation: 'LOO-sid' },
      { word: 'Mundane', definition: 'Lacking interest or excitement; dull', pronunciation: 'mun-DAYN' },
      { word: 'Nonchalant', definition: 'Feeling or appearing casually calm and relaxed', pronunciation: 'non-shuh-LAHNT' },
      { word: 'Ostentatious', definition: 'Characterized by pretentious display; designed to impress', pronunciation: 'os-ten-TAY-shuhs' },
      { word: 'Plausible', definition: 'Seeming reasonable or probable', pronunciation: 'PLAW-zuh-buhl' },
      { word: 'Querulous', definition: 'Complaining in a petulant or whining manner', pronunciation: 'KWER-uh-luhs' },
      { word: 'Reclusive', definition: 'Avoiding the company of other people; solitary', pronunciation: 'rih-KLOO-siv' },
      { word: 'Sycophant', definition: 'A person who acts obsequiously toward someone important', pronunciation: 'SIK-uh-fuhnt' },
      { word: 'Taciturn', definition: 'Reserved or uncommunicative in speech; saying little', pronunciation: 'TAS-ih-turn' },
      { word: 'Verbose', definition: 'Using more words than needed; wordy', pronunciation: 'ver-BOHS' }
    ];

    // Try multiple free / open-source APIs in order
    async function tryFetchFromAPIs() {
      const sources = [
        // 1. Random Words API (word + definition + pronunciation)
        async () => {
          const res = await fetch('https://random-words-api.vercel.app/word', { signal: AbortSignal.timeout(4000) });
          if (!res.ok) throw new Error('vercel api');
          let data = await res.json();
          if (Array.isArray(data)) data = data[0];
          if (!data || !data.word) throw new Error('empty');
          return {
            word: data.word,
            definition: (data.definition || '').trim() || null,
            pronunciation: data.pronunciation || data.word,
            source: 'Random Words API'
          };
        },
        // 2. Heroku Random Word API (word only)
        async () => {
          const res = await fetch('https://random-word-api.herokuapp.com/word', { signal: AbortSignal.timeout(4000) });
          if (!res.ok) throw new Error('heroku api');
          const data = await res.json();
          const word = Array.isArray(data) ? data[0] : data;
          if (!word) throw new Error('empty');
          return { word, definition: null, pronunciation: word, source: 'Random Word API' };
        },
        // 3. Another public random word endpoint
        async () => {
          const res = await fetch('https://random-word-api.herokuapp.com/word?number=1', { signal: AbortSignal.timeout(4000) });
          if (!res.ok) throw new Error('heroku2');
          const data = await res.json();
          const word = Array.isArray(data) ? data[0] : data;
          if (!word) throw new Error('empty');
          return { word, definition: null, pronunciation: word, source: 'Random Word API' };
        }
      ];

      for (const source of sources) {
        try {
          const result = await source();
          // If we only got a bare word, try to enrich with Free Dictionary API
          if (result.word && !result.definition) {
            try {
              const defRes = await fetch(
                `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(result.word)}`,
                { signal: AbortSignal.timeout(3000) }
              );
              if (defRes.ok) {
                const defData = await defRes.json();
                if (Array.isArray(defData) && defData[0]) {
                  const entry = defData[0];
                  const meaning = entry.meanings?.[0]?.definitions?.[0]?.definition;
                  const phonetic = entry.phonetic || entry.phonetics?.[0]?.text || result.word;
                  if (meaning) {
                    result.definition = meaning;
                    result.pronunciation = phonetic.replace(/\//g, '') || result.word;
                  }
                }
              }
            } catch (_) { /* definition optional */ }
          }
          if (!result.definition) {
            result.definition = 'Definition not available for this word.';
          }
          return result;
        } catch (e) {
          console.warn('API source failed:', e.message);
          continue;
        }
      }
      return null; // all APIs failed
    }

    async function fetchWord() {
      setStatus('Fetching a new word…');
      document.getElementById('btnNew').disabled = true;

      let result = null;
      try {
        result = await tryFetchFromAPIs();
      } catch (err) {
        console.error(err);
      }

      if (result && result.word) {
        current = {
          word: result.word,
          definition: result.definition,
          pronunciation: result.pronunciation || result.word
        };
        // setStatus(`Word from ${result.source}`);
        setStatus('Start Practice');
      } else {
        // Full offline fallback – 50 curated words
        current = OFFLINE_WORDS[Math.floor(Math.random() * OFFLINE_WORDS.length)];
        // setStatus('Using offline word list (APIs unavailable)');
        setStatus('Start Practice');
      }

      if (mode === 'quiz') {
        document.getElementById('word').textContent = '???';
        document.getElementById('pronunciation').textContent = '';
        document.getElementById('definition').style.display = 'none';
        document.getElementById('quizInput').value = '';
        document.getElementById('feedback').textContent = '';
        setStatus((result ? 'New word loaded' : 'Offline word loaded') + ' – listen to the definition');
        await speakDefinition();
      } else {
        showCurrent();
      }

      ['btnSpeakWord', 'btnSpeakDef', 'btnSpeakAll', 'btnMic'].forEach(id => {
        document.getElementById(id).disabled = false;
      });
      document.getElementById('btnNew').disabled = false;
    }

    async function speakWord() {
      if (!current.word) return;
      setStatus('Speaking the word…');
      await speak(current.word, 0.85);
      setStatus('');
    }

    async function speakDefinition() {
      if (!current.definition) return;
      setStatus('Speaking definition…');
      await speak(current.definition, 0.95);
      setStatus('');
    }

    async function speakAll() {
      if (!current.word) return;
      setStatus('Full lesson…');
      await speak(`The word is ${current.word}.`, 0.9);
      await new Promise(r => setTimeout(r, 300));
      await speak(`It is pronounced ${current.pronunciation}.`, 0.9);
      await new Promise(r => setTimeout(r, 300));
      await speak(`Definition: ${current.definition}.`, 0.95);
      await new Promise(r => setTimeout(r, 400));
      await speak(`Once more: ${current.word}.`, 0.85);
      setStatus('Lesson complete');
    }

    function startListening() {
      if (!recognition) {
        setStatus('Speech recognition not supported in this browser. Try Chrome or Edge.');
        return;
      }
      if (!current.word) {
        setStatus('Load a word first');
        return;
      }
      if (isListening) {
        recognition.stop();
        return;
      }
      // Stop any ongoing speech first so it doesn't hear itself
      speechSynthesis.cancel();
      // Small delay so TTS fully stops before mic opens
      setTimeout(() => {
        try {
          recognition.start();
        } catch (e) {
          setStatus('Could not start microphone. Click again.');
        }
      }, 250);
    }

    function normalize(str) {
      return (str || '')
        .toLowerCase()
        .replace(/[^\w\s]/g, '')   // remove punctuation
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Simple Levenshtein distance
    function editDistance(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function isCloseMatch(spoken, target) {
      spoken = normalize(spoken);
      target = normalize(target);
      if (!spoken || !target) return false;

      // 1. Exact match only (most reliable)
      if (spoken === target) return true;

      // 2. User said a full sentence that contains the exact word
      //    e.g. "the word is serendipity" → accept
      const words = spoken.split(/\s+/);
      if (words.includes(target)) return true;

      // 3. Very light tolerance: only simple plural/singular difference
      //    "cats" vs "cat" – nothing more aggressive
      if (spoken + 's' === target || spoken === target + 's') return true;
      if (spoken + 'es' === target || spoken === target + 'es') return true;

      // 4. Strict edit distance – almost no room for error
      //    length 1-5 → must be exact (already checked above)
      //    length 6-8 → at most 1 character difference
      //    length 9+  → at most 2 character differences
      const dist = editDistance(spoken, target);
      if (target.length >= 9 && dist <= 2) return true;
      if (target.length >= 6 && dist <= 1) return true;

      return false;   // everything else is rejected
    }

    function checkSpokenWord(heard, alternatives = []) {
      const target = current.word;
      const allHeard = [heard, ...alternatives].filter(Boolean);
      const unique = [...new Set(allHeard.map(normalize))];

      const matched = unique.some(c => isCloseMatch(c, target));

      if (matched) {
        setStatus('✓ Correct! Nice pronunciation.');
        speak(`Great job! You said ${current.word} correctly.`);
        document.getElementById('word').style.color = '#4ade80';
        setTimeout(() => { document.getElementById('word').style.color = ''; }, 1800);
      } else {
        setStatus(`✗ Not a match. Try saying “${current.word}” again.`);
        speak(`Try again.`);
      }
    }

    function checkAnswer() {
      const input = document.getElementById('quizInput').value.trim().toLowerCase();
      const answer = current.word.toLowerCase();
      const fb = document.getElementById('feedback');
      if (!input) {
        fb.textContent = 'Please type something';
        fb.className = 'feedback';
        return;
      }
      if (input === answer) {
        fb.textContent = '✓ Correct! Well done.';
        fb.className = 'feedback correct';
        // Reveal the word
        document.getElementById('word').textContent = current.word;
        document.getElementById('pronunciation').textContent = current.pronunciation ? `/${current.pronunciation}/` : '';
        speak(`Correct! The word is ${current.word}.`);
      } else {
        fb.textContent = `✗ Not quite. Try again or reveal.`;
        fb.className = 'feedback wrong';
      }
    }

    // Load voices (Chrome needs this)
    if (window.speechSynthesis) {
      speechSynthesis.onvoiceschanged = () => {};
      // Pre-load
      speechSynthesis.getVoices();
    }

    // Keyboard: Enter in quiz
    document.getElementById('quizInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    // Auto-start with a word
    window.addEventListener('load', () => {
      // Small delay so voices are ready
      setTimeout(fetchWord, 400);
    });
  </script>
</body>
</html>
